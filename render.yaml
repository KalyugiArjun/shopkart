services:
  - type: web
    name: shopkart
    runtime: php
    plan: free
    buildCommand: bash render-build.sh
    startCommand: touch database/database.sqlite && php artisan migrate --force && php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: true
      - key: APP_KEY
        value: base64:w4hFeVm7Mi5e4TSikhPMx6u+Ku/lYq9GP6YwKdjmNdg=
      - key: APP_URL
        value: https://shopkart-2e78.onrender.com
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
