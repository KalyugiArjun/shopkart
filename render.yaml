services:
  - type: web
    name: shopkart
    runtime: php
    plan: free
    buildCommand: composer install --no-dev --optimize-autoloader && touch database/database.sqlite && php artisan migrate --force --seed
    startCommand: php artisan serve --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: cookie
      - key: CACHE_STORE
        value: file
